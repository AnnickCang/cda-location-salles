<h1 class="title" id="rooms-title">Toutes nos salles</h1>

<section
  class="room-container"
  aria-labelledby="rooms-title"
  [attr.aria-busy]="roomStore.loading()"
>
  @if (roomStore.loading()) {
    <p role="status">Chargement des salles...</p>
  } @else if (roomStore.error()) {
    <p role="alert">{{ roomStore.error() }}</p>
  } @else {
    @for (room of roomStore.rooms(); track room.id) {
      <app-room-card [room]="room" />
    }
  }
</section>
