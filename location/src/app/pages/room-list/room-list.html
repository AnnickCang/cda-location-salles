<h1>Toutes nos salles</h1>
<section class="room-container">
  @if (roomStore.loading()) {
    <p>Chargement des données</p>
  } @else if (roomStore.error()) {
    <p role="alert">{{ roomStore.error() }}</p>
  } @else {
    @for (room of roomStore.rooms(); track room.id) {
      <app-room-card [room]="room" />
    }
  }
</section>
